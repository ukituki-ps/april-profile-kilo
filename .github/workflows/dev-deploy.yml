# Автодеплой на dev: merge PR в develop → push → этот workflow на self-hosted runner.
# См. docs/DEPLOYMENT_STRATEGY.md

name: Deploy to dev

on:
  push:
    branches:
      - develop
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  build-docs:
    name: Build docs artifact
    runs-on: [self-hosted, dev, april-profile]
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - name: Build Docusaurus
        run: make docs-build

      - name: Upload docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-site-build-${{ github.sha }}
          path: docs-site/build
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Sync repo and run deploy.sh
    needs: build-docs
    # Только стенд Orange Pi: метка `april-profile-stand` (см. docs/guides/PROJECT_DEFAULTS.md).
    # CI / сборка образа остаются на runner'ах с `april-profile` (например 192.168.1.29).
    runs-on: [self-hosted, dev, april-profile-stand]
    timeout-minutes: 60
    steps:
      - name: Download docs artifact
        uses: actions/download-artifact@v4
        with:
          name: docs-site-build-${{ github.sha }}
          path: /tmp/docs-site-build-${{ github.sha }}

      - name: Login to ghcr.io for image pull
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_PULL_TOKEN || github.token }}
        run: |
          set -euo pipefail
          echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Wait for backend image tag in ghcr
        run: |
          set -euo pipefail
          IMAGE_REF="ghcr.io/${{ github.repository_owner }}/april-profile-backend:${{ github.sha }}"
          echo "Waiting for image: ${IMAGE_REF}"
          for attempt in $(seq 1 90); do
            if docker buildx imagetools inspect "${IMAGE_REF}" >/dev/null 2>&1; then
              echo "Image is available in registry."
              exit 0
            fi
            echo "Attempt ${attempt}/90: image not found yet, retry in 10s..."
            sleep 10
          done
          echo "Timeout: image tag was not found in ghcr: ${IMAGE_REF}" >&2
          exit 1

      - name: Checkout ref and deploy
        env:
          APRIL_DEPLOY_ROOT: ${{ vars.APRIL_DEPLOY_ROOT }}
        run: |
          set -euo pipefail
          ROOT="${APRIL_DEPLOY_ROOT:-/opt/april-profile}"
          echo "Deploy root: ${ROOT}"
          echo "Commit: ${{ github.sha }}"
          test -d "${ROOT}/.git"
          cd "${ROOT}"
          echo "== pre-checkout status =="
          git status --porcelain=v1 --untracked-files=all || true
          git diff -- deploy.sh || true
          ls -l deploy.sh || true
          git fetch origin
          git reset --hard
          git clean -fd
          git checkout "${{ github.sha }}"
          rm -rf docs-site/build
          mkdir -p docs-site/build
          cp -a /tmp/docs-site-build-${{ github.sha }}/. docs-site/build/
          ls -la docs-site/build | sed -n '1,20p'
          test -x ./deploy.sh
          # Снять утечку портовых переменных из окружения раннера (readonly/экспорт), чтобы compose и deploy.sh
          # брали значения из серверного .env и дефолты из docker-compose.yml.
          env -u DOCS_HTTP_PORT -u STRUCTURIZR_HTTP_PORT -u BACKEND_HTTP_PORT -u POSTGRES_PORT -u REDIS_PORT \
            IMAGE_TAG_BACKEND="${{ github.sha }}" SKIP_GIT_PULL=1 SKIP_DOCS_BUILD=1 ./deploy.sh
