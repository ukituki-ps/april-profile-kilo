# Автодеплой на dev: merge PR в develop → push → этот workflow на self-hosted runner.
# См. docs/DEPLOYMENT_STRATEGY.md

name: Deploy to dev

on:
  push:
    branches:
      - develop
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    name: Sync repo and run deploy.sh
    runs-on: [self-hosted, dev, april-profile]
    timeout-minutes: 60
    steps:
      - name: Login to ghcr.io for image pull
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_PULL_TOKEN || github.token }}
        run: |
          set -euo pipefail
          echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Checkout ref and deploy
        env:
          APRIL_DEPLOY_ROOT: ${{ vars.APRIL_DEPLOY_ROOT }}
        run: |
          set -euo pipefail
          ROOT="${APRIL_DEPLOY_ROOT:-/opt/april-profile}"
          echo "Deploy root: ${ROOT}"
          echo "Commit: ${{ github.sha }}"
          test -d "${ROOT}/.git"
          cd "${ROOT}"
          git fetch origin
          git checkout "${{ github.sha }}"
          test -x ./deploy.sh
          IMAGE_TAG_BACKEND="${{ github.sha }}" SKIP_GIT_PULL=1 ./deploy.sh
