# Минимальный CI для feature/fix веток: Docusaurus, OpenAPI lint, docker compose, frontend (DS + shell).
# Полный пайплайн — `.github/workflows/ci.yml` (в т.ч. проверка обратной совместимости OpenAPI).
name: bootstrap-ci

on:
  push:
    branches: [main, develop, 'feature/**', 'fix/**']
  pull_request:
    branches: [main, develop]

jobs:
  docs-and-compose:
    runs-on: [self-hosted, dev, april-profile]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULES_TOKEN || github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            docs-site/package-lock.json
            frontend/package-lock.json

      - name: Install docs-site dependencies
        working-directory: docs-site
        run: npm ci

      - name: Build Docusaurus
        working-directory: docs-site
        run: npm run build

      - name: Lint OpenAPI
        run: make openapi-lint

      - name: Docker Compose config
        run: docker compose config

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true

      - name: Go vet and build
        run: go vet ./... && go build -o /tmp/april-profile ./cmd/april-profile && go build -o /tmp/april-worker ./cmd/april-worker

      - name: Atlas migrate validate
        run: docker run --rm -v "$PWD:/work" -w /work arigaio/atlas:0.32.0 migrate validate --dir "file://atlas/migrations"

      - name: Enable corepack (pnpm for ds:prepare)
        run: corepack enable

      - name: Frontend lint, test and build
        working-directory: frontend
        run: npm ci && npm run lint && npm run test && npm run build
