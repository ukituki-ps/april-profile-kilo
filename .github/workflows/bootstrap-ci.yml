# Минимальный CI для feature/fix веток: Docusaurus, OpenAPI lint, docker compose, frontend (DS + shell).
# Полный пайплайн — `.github/workflows/ci.yml` (в т.ч. проверка обратной совместимости OpenAPI).
name: bootstrap-ci

on:
  push:
    branches: [main, develop, 'feature/**', 'fix/**']
  pull_request:
    branches: [main, develop]

jobs:
  docs-and-compose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULES_TOKEN || github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            docs-site/package-lock.json
            frontend/package-lock.json

      - name: Install docs-site dependencies
        working-directory: docs-site
        run: npm ci

      - name: Build Docusaurus
        working-directory: docs-site
        run: npm run build

      - name: Lint OpenAPI
        run: make openapi-lint

      - name: Docker Compose config
        run: docker compose config

      - name: Enable corepack (pnpm for ds:prepare)
        run: corepack enable

      - name: Frontend lint, test and build
        working-directory: frontend
        run: npm ci && npm run lint && npm run test && npm run build
