# Минимальный CI для feature/fix веток: Docusaurus, OpenAPI lint, docker compose, frontend (DS + shell).
# Полный пайплайн — `.github/workflows/ci.yml` (в т.ч. проверка обратной совместимости OpenAPI).
name: bootstrap-ci

on:
  push:
    branches: [main, develop, 'feature/**', 'fix/**']
  pull_request:
    branches: [main, develop]

env:
  GOMODCACHE: ${{ vars.GOMODCACHE_PATH || '/var/cache/april-profile/go/pkg/mod' }}
  GOCACHE: ${{ vars.GOCACHE_PATH || '/var/cache/april-profile/go/build' }}
  npm_config_cache: ${{ vars.NPM_CACHE_PATH || '/var/cache/april-profile/npm' }}

jobs:
  docs-and-compose:
    runs-on: [self-hosted, dev, april-profile]
    timeout-minutes: 25
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULES_TOKEN || github.token }}

      - name: Guard workflow cache policy
        run: python3 scripts/ci/check-no-remote-node-cache.py

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare local cache directories
        run: mkdir -p "${npm_config_cache}" "${GOMODCACHE}" "${GOCACHE}"

      - name: Install docs-site dependencies
        working-directory: docs-site
        run: npm ci --prefer-offline

      - name: Build Docusaurus
        working-directory: docs-site
        run: npm run build

      - name: Lint OpenAPI
        run: make openapi-lint

      - name: Docker Compose config
        run: docker compose config

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: false

      - name: Go vet and build
        run: go vet ./... && go build -o /tmp/april-profile ./cmd/april-profile && go build -o /tmp/april-worker ./cmd/april-worker

      - name: Atlas migrate validate
        run: docker run --rm -v "$PWD:/work" -w /work arigaio/atlas:0.32.0 migrate validate --dir "file://atlas/migrations"

      - name: Enable corepack (pnpm for ds:prepare)
        run: corepack enable

      - name: Frontend lint, test and build
        working-directory: frontend
        env:
          NODE_AUTH_TOKEN: ${{ secrets.APRIL_NPM_READ_TOKEN || secrets.GITHUB_TOKEN }}
        run: npm ci --prefer-offline && npm run lint && npm run test && npm run build
