# ONE-SHOT: regenerate frontend/package-lock.json for DS ^0.1.12
# .npmrc in frontend/ already has scope @ukituki-ps → GPR mapping.
# Do NOT use registry-url in setup-node.
name: oneshot-lockfile-regen-0112

on:
  pull_request:
    branches: [develop]
    paths:
      - frontend/package.json
      - frontend/packages/profile-ui/package.json

permissions:
  contents: write
  packages: read

jobs:
  regenerate:
    runs-on: [self-hosted, ci, profile]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          clean: true

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Debug — verify npmrc and GPR access
        working-directory: frontend
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GPR_READ_TOKEN }}
        run: |
          set -ex
          echo "=== .npmrc contents ==="
          cat .npmrc
          echo "=== NODE_AUTH_TOKEN length ==="
          echo "${#NODE_AUTH_TOKEN}"
          echo "=== npm cache location ==="
          npm config get cache
          # Clean any stale cache that may hold ETARGET for 0.1.12
          npm cache clean --force
          echo "=== Test GPR read ==="
          npm view @ukituki-ps/april-tokens version --json 2>&1 || true
          npm view @ukituki-ps/april-ui version --json 2>&1 || true

      - name: Regenerate lockfile
        working-directory: frontend
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GPR_READ_TOKEN }}
        run: |
          set -ex
          rm -f package-lock.json
          # GPR_READ_TOKEN is a PAT with read:packages scope — can read DisignApril-kilo GPR
          npm install --no-audit --no-fund --loglevel=verbose 2>&1
          echo "=== Resolved DS versions ======"
          grep '@april/' package-lock.json | grep version | head -10

      - name: Verify contains 0.1.12
        working-directory: frontend
        run: |
          if ! grep -q '0\.1\.12' package-lock.json; then
            echo "FAIL: no 0.1.12 in lockfile"
            grep '@april/ui' package-lock.json | head -5
            exit 1
          fi
          echo "OK: DS ^0.1.12 resolved"

      - name: Commit lockfile to develop
        working-directory: frontend
        run: |
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/ukituki-ps/april-profile-kilo.git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile changes"
            exit 0
          fi
          git commit -m "chore(lockfile): regenerate for DS ^0.1.12 (workspace:*→workspace:^ fix)"
          git push origin develop
          echo "== LOCKFILE COMMITTED TO develop =="
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
