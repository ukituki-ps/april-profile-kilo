# ONE-SHOT: regenerate frontend/package-lock.json for DS ^0.1.12
# .npmrc in frontend/ already has scope @ukituki-ps → GPR mapping.
name: oneshot-lockfile-regen-0112

on:
  pull_request:
    branches: [develop]
    paths:
      - frontend/package.json
      - frontend/packages/profile-ui/package.json

permissions:
  contents: write
  packages: read

jobs:
  regenerate:
    runs-on: [self-hosted, ci, profile]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          clean: true

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Regenerate lockfile
        working-directory: frontend
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GPR_READ_TOKEN }}
        run: |
          set -ex
          rm -f package-lock.json
          npm cache clean --force
          # Try normal install first, fall back to legacy-peer-deps if needed
          if ! npm install --no-audit --no-fund 2>&1; then
            echo "Retrying with --legacy-peer-deps..."
            npm install --no-audit --no-fund --legacy-peer-deps 2>&1
          fi
          echo "=== Resolved DS versions ======"
          grep '@april/\|@ukituki-ps' package-lock.json | grep version | head -10

      - name: Verify contains 0.1.12
        working-directory: frontend
        run: |
          set -ex
          if ! grep -q '0\.1\.12' package-lock.json; then
            echo "FAIL: no 0.1.12 in lockfile"
            grep '@april/\|@ukituki-ps' package-lock.json | grep version | head || true
            exit 1
          fi
          echo "OK: DS ^0.1.12 resolved"

      - name: Upload npm log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: npm-debug-logs
          path: /home/ukituki/.npm/_logs/*.log
          retention-days: 2

      - name: Commit lockfile to develop
        working-directory: frontend
        run: |
          set -ex
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/ukituki-ps/april-profile-kilo.git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile changes"
            exit 0
          fi
          git commit -m "chore(lockfile): regenerate for DS ^0.1.12 (workspace:*→workspace:^ fix)"
          git push origin develop
          echo "== LOCKFILE COMMITTED TO develop =="
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
