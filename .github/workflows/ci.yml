# Обязательные проверки: OpenAPI (oasdiff), lint OpenAPI, Docusaurus, frontend (DS + shell).
# Расширяйте при появлении backend — см. docs/TESTING_STRATEGY.md и пример [april-worker](https://github.com/ukituki-ps/april-worker).
name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  openapi-compatibility:
    name: OpenAPI compatibility (no breaking changes)
    runs-on: [self-hosted, dev, april-profile]
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"

      - name: Install oasdiff
        run: go install github.com/oasdiff/oasdiff@latest

      - name: Check OpenAPI backward compatibility
        env:
          BASE_REF: origin/develop
        run: |
          export PATH="$HOME/go/bin:$PATH"
          scripts/check-openapi-compat.sh

  quality:
    name: Lint OpenAPI and build docs
    runs-on: [self-hosted, dev, april-profile]
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - name: OpenAPI lint
        run: make openapi-lint

      - name: Docusaurus build
        run: make docs-build

  backend:
    name: Go (vet, build) and Atlas migrations
    runs-on: [self-hosted, dev, april-profile]
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true

      - name: Go vet and build
        run: go vet ./... && go build -o /tmp/april-profile ./cmd/april-profile && go build -o /tmp/april-worker ./cmd/april-worker

      - name: Atlas migrate validate
        run: docker run --rm -v "$PWD:/work" -w /work arigaio/atlas:0.32.0 migrate validate --dir "file://atlas/migrations"

  frontend:
    name: Frontend (design system + shell)
    runs-on: [self-hosted, dev, april-profile]
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULES_TOKEN || github.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Enable corepack (pnpm for ds:prepare)
        run: corepack enable

      - name: Lint, test and build frontend
        working-directory: frontend
        run: npm ci && npm run lint && npm run test && npm run build
