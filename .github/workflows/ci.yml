# Обязательные проверки: обратная совместимость OpenAPI (oasdiff), lint OpenAPI, сборка Docusaurus.
# Расширяйте при появлении Go/фронтенда приложения — см. docs/TESTING_STRATEGY.md и пример [april-worker](https://github.com/ukituki-ps/april-worker).
name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  openapi-compatibility:
    name: OpenAPI compatibility (no breaking changes)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"

      - name: Install oasdiff
        run: go install github.com/oasdiff/oasdiff@latest

      - name: Check OpenAPI backward compatibility
        env:
          BASE_REF: origin/develop
        run: |
          export PATH="$HOME/go/bin:$PATH"
          scripts/check-openapi-compat.sh

  quality:
    name: Lint OpenAPI and build docs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - name: OpenAPI lint
        run: make openapi-lint

      - name: Docusaurus build
        run: make docs-build
