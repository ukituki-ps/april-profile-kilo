openapi: 3.1.0
info:
  title: April Profile API
  description: |
    REST API микросервиса April Profile (профиль пользователя).
    Спецификация ведётся в репозитории (`openapi/openapi.yaml`); скорректируйте `servers` под свой gateway.
    Для AprilHub BFF (фаза 4.2) публичный путь согласован как `/admin/profile/api/v1/...`,
    при этом сервисный путь остаётся `/api/v1/...` и tenant берётся только из JWT claim.
  version: 0.3.0
  license:
    name: UNLICENSED
servers:
  - url: /admin/profile/api
    description: |
      Рекомендуемый базовый путь за AprilHub BFF (same-origin админ-маршрут).
      BFF/reverse proxy снимает префикс `/admin/profile` и проксирует в AprilProfile `/api`.
  - url: https://dev.profile.april.ukituki.tech/api
    description: |
      Прямой URL сервиса на dev-стенде (без BFF Hub), используется для backend smoke.
      Подставьте базовый URL за gateway. См. `docs/guides/FORK_AND_CUSTOMIZE.md`.
tags:
  - name: Admin
    description: |
      Операции merge дубликатов и очереди конфликтов authority. Требуют realm-роль (см. `KEYCLOAK_ADMIN_REALM_ROLE`).
paths:
  /v1/system/ping:
    get:
      summary: Публичная проверка API (без JWT)
      operationId: getSystemPing
      tags: [System]
      security: []
      responses:
        '200':
          description: Сервис отвечает
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    example: ok
  /v1/auth/whoami:
    get:
      summary: Идентичность и tenant из JWT (Keycloak)
      description: |
        `tenant_id` берётся только из согласованного claim access token (см. README / задачу 005), не из query/body.
      operationId: getAuthWhoAmI
      tags: [Auth]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Текущий субъект и tenant из токена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhoAmI'
        '401':
          description: Нет или невалидный Bearer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: В токене нет claim с tenant_id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/entity-types:
    get:
      summary: Список типов сущностей tenant
      operationId: listEntityTypes
      tags: [EntityTypes]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Каталог типов сущностей текущего tenant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityTypeListResponse'
        '401':
          description: Нет или невалидный Bearer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: В токене нет claim с tenant_id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Создать черновик типа сущности
      operationId: createEntityTypeDraft
      tags: [EntityTypes]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEntityTypeDraftRequest'
      responses:
        '201':
          description: Черновик типа создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityType'
        '400':
          description: Невалидный body или пустые поля namespace/code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Нет или невалидный Bearer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: В токене нет claim с tenant_id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/entity-types/{entityTypeID}/publish:
    post:
      summary: Опубликовать черновик типа сущности (создаёт новую immutable-ревизию схемы; повторные вызовы допускаются)
      operationId: publishEntityTypeDraft
      tags: [EntityTypes]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: entityTypeID
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Тип успешно опубликован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityType'
        '404':
          description: Тип не найден в текущем tenant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Черновик не проходит структурную валидацию/invariants
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Нет или невалидный Bearer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: В токене нет claim с tenant_id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/entity-types/{entityTypeID}:
    get:
      summary: Получить семейство типа с черновиком и последней ревизией
      operationId: getEntityType
      tags: [EntityTypes]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EntityTypeIdPath'
      responses:
        '200':
          description: Тип сущности
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityType'
        '404':
          description: Не найдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenTenant'
    patch:
      summary: Обновить namespace/code семейства типа
      operationId: patchEntityTypeFamily
      tags: [EntityTypes]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EntityTypeIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchEntityTypeFamilyRequest'
      responses:
        '200':
          description: Обновлённый тип
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityType'
        '404':
          description: Семейство типа не найдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Дубликат пары namespace/code в tenant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenTenant'
    delete:
      summary: Удалить семейство (только без ревизий и без сущностей)
      operationId: deleteEntityTypeFamily
      tags: [EntityTypes]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EntityTypeIdPath'
      responses:
        '204':
          description: Удалено
        '404':
          description: Семейство типа не найдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Есть опубликованные ревизии или сущности
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenTenant'
  /v1/entity-types/{entityTypeID}/draft:
    put:
      summary: Сохранить черновик с optimistic concurrency
      operationId: putEntityTypeDraft
      tags: [EntityTypes]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EntityTypeIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutEntityTypeDraftRequest'
      responses:
        '200':
          description: Черновик сохранён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityType'
        '404':
          description: Семейство типа не найдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Конфликт if_draft_schema_version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          description: Невалидный JSON или отсутствует if_draft_schema_version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenTenant'
  /v1/entity-types/{entityTypeID}/revisions:
    get:
      summary: Список опубликованных ревизий семейства
      operationId: listEntityTypeRevisions
      tags: [EntityTypes]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EntityTypeIdPath'
      responses:
        '200':
          description: Ревизии по возрастанию revision_no
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityTypeRevisionListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenTenant'
  /v1/entity-types/{entityTypeID}/revisions/by-revision-no/{revisionNo}:
    get:
      summary: Получить ревизию по номеру
      operationId: getEntityTypeRevisionByNo
      tags: [EntityTypes]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EntityTypeIdPath'
        - in: path
          name: revisionNo
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Ревизия схемы
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityTypeRevision'
        '404':
          description: Ревизия или семейство не найдены
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenTenant'
  /v1/entity-types/{entityTypeID}/revisions/{revisionID}:
    get:
      summary: Получить ревизию по UUID
      operationId: getEntityTypeRevision
      tags: [EntityTypes]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EntityTypeIdPath'
        - in: path
          name: revisionID
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Ревизия схемы
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityTypeRevision'
        '404':
          description: Ревизия или семейство не найдены
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenTenant'
  /v1/entities/batch-upgrade-entity-type-revision:
    post:
      summary: Пакетный апгрейд привязки к одной целевой ревизии
      operationId: batchUpgradeEntityTypeRevision
      tags: [Profiles]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchUpgradeEntityTypeRevisionRequest'
      responses:
        '200':
          description: Сводка по сущностям
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchUpgradeEntityTypeRevisionResponse'
        '400':
          description: Невалидный запрос или целевая ревизия
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenTenant'
  /v1/entities:
    get:
      summary: Список текущих профилей (server-side search/filter/pagination)
      operationId: listEntityProfiles
      tags: [Profiles]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: search
          required: false
          schema:
            type: string
          description: Поиск по `entity_id` и текстовым фрагментам текущего `document`.
        - in: query
          name: entity_type_id
          required: false
          schema:
            type: string
            format: uuid
          description: Фильтр по типу сущности.
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: Размер страницы.
        - in: query
          name: cursor
          required: false
          schema:
            type: string
          description: Непрозрачный курсор следующей страницы.
        - in: query
          name: sort
          required: false
          schema:
            type: string
            enum: [updated_desc, updated_asc]
            default: updated_desc
          description: Детерминированная сортировка по `created_at` текущей версии + `entity_id`.
      responses:
        '200':
          description: Страница списка профилей
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileListResponse'
        '401':
          description: Нет или невалидный Bearer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: В токене нет claim с tenant_id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Невалидный `cursor`/`limit`/query-параметры
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Слишком много запросов (rate limit, если включён)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Внутренняя ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Создать профиль сущности (version=1)
      operationId: createEntityProfile
      tags: [Profiles]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEntityRequest'
      responses:
        '201':
          description: Профиль создан, первая версия сохранена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileSnapshot'
        '400':
          description: Невалидный payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Тип сущности не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Тип не опубликован, конфликт external mapping или все поля заблокированы authority
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Документ не соответствует JSON Schema последней опубликованной ревизии типа
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Нет или невалидный Bearer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: В токене нет claim с tenant_id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/entities/{entityID}:
    get:
      summary: Получить текущую версию профиля
      description: |
        При активной серверной политике ABAC (`ABAC_SEGMENT_ACCESS_JSON`) тело `document` фильтруется
        по сегментам полей и realm-ролям из JWT (`realm_access.roles`); см. описание `ProfileSnapshot`.
      operationId: getEntityCurrentProfile
      tags: [Profiles]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EntityID'
      responses:
        '200':
          description: Текущая версия профиля
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileSnapshot'
        '404':
          description: Сущность не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Нет или невалидный Bearer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: В токене нет claim с tenant_id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      summary: Обновить профиль (append-only новая версия)
      operationId: updateEntityProfile
      tags: [Profiles]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EntityID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEntityRequest'
      responses:
        '200':
          description: Создана новая версия профиля
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileSnapshot'
        '400':
          description: Невалидный payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Сущность не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Конфликт external mapping или все предложенные поля отклонены authority (код `authority_all_blocked`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Нет или невалидный Bearer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: В токене нет claim с tenant_id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Удалить сущность и её версии
      operationId: deleteEntityProfile
      tags: [Profiles]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EntityID'
      responses:
        '204':
          description: Сущность удалена
        '404':
          description: Сущность не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Нет или невалидный Bearer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: В токене нет claim с tenant_id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/entities/{entityID}/upgrade-entity-type-revision:
    post:
      summary: Апгрейд привязки сущности к опубликованной ревизии схемы типа
      description: |
        Валидирует текущий документ профиля по целевой JSON Schema ревизии; при успехе обновляет `bound_entity_type_revision_id`
        и при смене ревизии добавляет новую строку `profile_versions` (append-only) и событие outbox.
      operationId: upgradeEntityTypeRevision
      tags: [Profiles]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EntityID'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpgradeEntityTypeRevisionRequest'
      responses:
        '200':
          description: Текущий снимок профиля после операции
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileSnapshot'
        '400':
          description: Невалидный JSON или целевая ревизия
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Сущность не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Документ не проходит валидацию по схеме целевой ревизии
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenTenant'
  /v1/entities/{entityID}/versions/{version}:
    get:
      summary: Получить конкретную версию профиля
      description: |
        Как и `GET /v1/entities/{entityID}` — при ABAC выдача `document` может быть усечена по ролям.
      operationId: getEntityProfileByVersion
      tags: [Profiles]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EntityID'
        - in: path
          name: version
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: Конкретная версия профиля
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileSnapshot'
        '404':
          description: Версия или сущность не найдены
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Нет или невалидный Bearer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: В токене нет claim с tenant_id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/external-mappings/{sourceSystem}/{externalID}/entity:
    get:
      summary: Получить текущий профиль по внешнему ключу
      description: |
        Как и остальные GET профиля — при ABAC `document` фильтруется по realm-ролям JWT.
      operationId: getEntityCurrentByExternal
      tags: [Profiles]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: sourceSystem
          required: true
          schema:
            type: string
        - in: path
          name: externalID
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Текущий профиль для внешнего ключа
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileSnapshot'
        '404':
          description: Маппинг не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Нет или невалидный Bearer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: В токене нет claim с tenant_id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/admin/profile-conflicts:
    get:
      summary: Список открытых конфликтов authority (admin)
      description: |
        Требуется роль realm из `realm_access.roles` (имя задаётся `KEYCLOAK_ADMIN_REALM_ROLE`, по умолчанию ожидается `april-profile-admin`).
      operationId: listProfileFieldConflicts
      tags: [Admin]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Открытые конфликты
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileConflictListResponse'
        '401':
          description: Нет или невалидный Bearer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Нет tenant claim или недостаточно прав realm-роли
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/admin/profile-conflicts/{conflictID}/resolve:
    post:
      summary: Ручное разрешение конфликта authority
      description: |
        Записывает выбранное значение как новую версию профиля с источником `manual` в `_meta.authority`, закрывает конфликт, пишет аудит.
      operationId: resolveProfileFieldConflict
      tags: [Admin]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: conflictID
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveProfileConflictRequest'
      responses:
        '200':
          description: Новая версия профиля после разрешения
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileSnapshot'
        '400':
          description: Невалидный body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Нет или невалидный Bearer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Недостаточно прав
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Конфликт не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/admin/entities/merge:
    post:
      summary: Явный merge дубликатов профилей (source → target)
      description: |
        Объединяет профили в пределах tenant и одного `entity_type_id`, переносит external mappings, удаляет source, пишет аудит.
      operationId: mergeEntityProfiles
      tags: [Admin]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MergeEntityProfilesRequest'
      responses:
        '200':
          description: Результат merge (целевой профиль)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MergeEntityProfilesResponse'
        '400':
          description: Некорректная пара сущностей
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Нет или невалидный Bearer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Недостаточно прав
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Сущность не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Коллизия external mapping при merge
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /healthz:
    get:
      summary: Liveness
      operationId: getHealthz
      tags: [System]
      security: []
      responses:
        '200':
          description: Сервис жив
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
  /readyz:
    get:
      summary: Readiness
      description: |
        Endpoint отражает готовность внешних зависимостей:
        - PostgreSQL (`database`)
        - Redis (`redis`)
        При недоступности хотя бы одной обязательной зависимости возвращается `503`.
      operationId: getReadyz
      tags: [System]
      security: []
      responses:
        '200':
          description: Готов принимать трафик
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyzResponse'
        '503':
          description: Не готов (зависимости недоступны)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyzResponse'

components:
  responses:
    Unauthorized:
      description: Нет или невалидный Bearer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ForbiddenTenant:
      description: В токене нет claim с tenant_id
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  parameters:
    EntityTypeIdPath:
      in: path
      name: entityTypeID
      required: true
      schema:
        type: string
        format: uuid
    EntityID:
      in: path
      name: entityID
      required: true
      schema:
        type: string
        format: uuid
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Access token Keycloak (проверка JWKS, iss, aud|azp).
        `tenant_id` извлекается только из trusted JWT claim, не из query/body/forwarded headers.
  schemas:
    WhoAmI:
      type: object
      required: [sub, tenant_id]
      properties:
        sub:
          type: string
          description: Subject из JWT (`sub`).
        tenant_id:
          type: string
          description: Идентификатор тенанта из доверенного claim (по умолчанию `tenant_id`).
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Стабильный код ошибки (машиночитаемый).
        message:
          type: string
          description: Описание для клиента и логов.
        request_id:
          description: Идентификатор запроса для корреляции в логах и трассировке.
          type: [string, 'null']
        issues:
          description: Детали при `code=schema_validation_failed` (несоответствие документа JSON Schema ревизии).
          type: array
          items:
            type: object
            required: [path, message]
            properties:
              path:
                type: string
              message:
                type: string
    ReadyzResponse:
      type: object
      required: [status, database, redis]
      properties:
        status:
          type: string
          enum: [ready, not_ready]
        database:
          type: string
          enum: [ok, unavailable]
        redis:
          type: string
          enum: [ok, unavailable, skipped]
    CreateEntityTypeDraftRequest:
      type: object
      required: [namespace, code, draft_schema]
      properties:
        namespace:
          type: string
          example: hr
        code:
          type: string
          example: employee
        draft_schema:
          type: object
          additionalProperties: true
          example:
            type: object
            properties:
              first_name:
                type: string
              last_name:
                type: string
            required: [first_name, last_name]
    EntityType:
      type: object
      required:
        - id
        - namespace
        - code
        - status
        - draft_schema
        - draft_schema_version
        - created_at
      properties:
        id:
          type: string
          format: uuid
        namespace:
          type: string
        code:
          type: string
        status:
          type: string
          enum: [draft, published]
        draft_schema:
          type: object
          additionalProperties: true
        draft_schema_version:
          type: integer
        published_schema:
          oneOf:
            - type: object
              additionalProperties: true
            - type: 'null'
        published_schema_version:
          oneOf:
            - type: integer
            - type: 'null'
        published_at:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
        created_at:
          type: string
          format: date-time
    EntityTypeListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/EntityType'
    PatchEntityTypeFamilyRequest:
      type: object
      required: [namespace, code]
      properties:
        namespace:
          type: string
        code:
          type: string
    PutEntityTypeDraftRequest:
      type: object
      required: [draft_schema, if_draft_schema_version]
      properties:
        draft_schema:
          type: object
          additionalProperties: true
        if_draft_schema_version:
          type: integer
          description: Ожидаемая текущая версия черновика с GET типа; при рассогласовании — 409.
    EntityTypeRevision:
      type: object
      required: [id, family_id, revision_no, schema, published_at]
      properties:
        id:
          type: string
          format: uuid
        family_id:
          type: string
          format: uuid
        revision_no:
          type: integer
          minimum: 1
        schema:
          type: object
          additionalProperties: true
        published_at:
          type: string
          format: date-time
    EntityTypeRevisionListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/EntityTypeRevision'
    UpgradeEntityTypeRevisionRequest:
      type: object
      description: |
        Пустое тело — апгрейд на последнюю опубликованную ревизию семейства сущности.
        Иначе задайте ровно одно из полей.
      properties:
        entity_type_revision_id:
          type: string
          format: uuid
        revision_no:
          type: integer
          minimum: 1
    BatchUpgradeEntityTypeRevisionRequest:
      type: object
      required: [entity_type_id]
      properties:
        entity_type_id:
          type: string
          format: uuid
          description: Семейство типа (`entity_type_families.id`).
        target_entity_type_revision_id:
          type: string
          format: uuid
        target_revision_no:
          type: integer
          minimum: 1
        entity_ids:
          type: array
          items:
            type: string
            format: uuid
        only_behind_latest:
          type: boolean
          description: Если true и `entity_ids` пуст — выбрать сущности, у которых привязка старее целевой ревизии.
        limit:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
        idempotency_key:
          type: string
          description: Опциональный ключ для корреляции на стороне клиента (сервер возвращает его в ответе).
    BatchUpgradeEntityTypeRevisionResponse:
      type: object
      required: [processed, succeeded, failed, results]
      properties:
        processed:
          type: integer
        succeeded:
          type: integer
        failed:
          type: integer
        idempotency_key:
          type: string
        results:
          type: array
          items:
            type: object
            required: [entity_id, ok]
            properties:
              entity_id:
                type: string
                format: uuid
              ok:
                type: boolean
              code:
                type: string
              message:
                type: string
              profile_version:
                type: integer
                format: int64
    ExternalRef:
      type: object
      required: [source_system, external_id]
      properties:
        source_system:
          type: string
          example: hris
        external_id:
          type: string
          example: EMP-100
    CreateEntityRequest:
      type: object
      required: [entity_type_id, document]
      properties:
        entity_type_id:
          type: string
          format: uuid
        document:
          type: object
          additionalProperties: true
        write_source:
          type: string
          description: Источник данных для начальной authority-метки полей (по умолчанию api).
        external_refs:
          type: array
          items:
            $ref: '#/components/schemas/ExternalRef'
    UpdateEntityRequest:
      type: object
      required: [document]
      properties:
        document:
          type: object
          additionalProperties: true
        write_source:
          type: string
          description: Логический источник входящего изменения для authority (по умолчанию api).
          example: hris
        external_refs:
          type: array
          items:
            $ref: '#/components/schemas/ExternalRef'
    ProfileSnapshot:
      type: object
      description: |
        Снимок профиля. Для **GET**-ответов при включённой политике ABAC на сервере поле `document`
        может не содержать часть namespace-объектов и корневых полей: видимость задаётся конфигурацией
        сопоставления сегментов полей realm-ролям Keycloak (переменная окружения `ABAC_SEGMENT_ACCESS_JSON`).
        Сегмент `default` — корневые скалярные поля документа; именованные вложенные объекты — сегменты
        с именем ключа верхнего уровня. В `_meta.authority` остаются только пути, относящиеся к разрешённым сегментам.
        **POST/PUT** возвращают полный документ без ABAC-фильтрации выдачи.
      required: [entity_id, entity_type_id, version, document, created_at, external_refs]
      properties:
        entity_id:
          type: string
          format: uuid
        entity_type_id:
          type: string
          format: uuid
        version:
          type: integer
          format: int64
        document:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
        external_refs:
          type: array
          items:
            $ref: '#/components/schemas/ExternalRef'
    ProfileListItem:
      type: object
      required: [entity_id, entity_type_id, version, created_at, preview]
      properties:
        entity_id:
          type: string
          format: uuid
        entity_type_id:
          type: string
          format: uuid
        version:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time
        preview:
          type: string
          description: Короткий preview текущего документа (для list UI).
    ProfileListResponse:
      type: object
      required: [items, total_count]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProfileListItem'
        next_cursor:
          oneOf:
            - type: string
            - type: 'null'
          description: Курсор следующей страницы, `null` на конце списка.
        total_count:
          type: integer
          format: int64
          minimum: 0
    ProfileConflictListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProfileFieldConflict'
    ProfileFieldConflict:
      type: object
      required:
        - id
        - entity_id
        - status
        - namespace
        - field_key
        - existing_source
        - incoming_source
        - reason
        - created_at
      properties:
        id:
          type: string
          format: uuid
        entity_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [open, resolved]
        namespace:
          type: string
        field_key:
          type: string
        existing_value: {}
        incoming_value: {}
        existing_source:
          type: string
        incoming_source:
          type: string
        reason:
          type: string
        created_at:
          type: string
          format: date-time
        resolved_at:
          type: string
          format: date-time
        resolution_value: {}
        resolved_by_sub:
          type: string
        resolution_notes:
          type: string
    ResolveProfileConflictRequest:
      type: object
      required: [resolution]
      properties:
        resolution:
          description: Выбранное значение поля (скаляр или объект — как в документе профиля).
        notes:
          type: string
    MergeEntityProfilesRequest:
      type: object
      required: [source_entity_id, target_entity_id]
      properties:
        source_entity_id:
          type: string
          format: uuid
        target_entity_id:
          type: string
          format: uuid
    MergeEntityProfilesResponse:
      type: object
      required: [target_entity_id, target_version, source_entity_id, document]
      properties:
        target_entity_id:
          type: string
          format: uuid
        target_version:
          type: integer
          format: int64
        source_entity_id:
          type: string
          format: uuid
        document:
          type: object
          additionalProperties: true
