openapi: 3.1.0
info:
  title: April Profile API
  description: |
    REST API микросервиса April Profile (профиль пользователя).
    Спецификация ведётся в репозитории (`openapi/openapi.yaml`); скорректируйте `servers` под свой gateway.
    Для AprilHub BFF (фаза 4.2) публичный путь согласован как `/admin/profile/api/v1/...`,
    при этом сервисный путь остаётся `/api/v1/...` и tenant берётся только из JWT claim.
  version: 0.2.0
  license:
    name: UNLICENSED
servers:
  - url: /admin/profile/api
    description: |
      Рекомендуемый базовый путь за AprilHub BFF (same-origin админ-маршрут).
      BFF/reverse proxy снимает префикс `/admin/profile` и проксирует в AprilProfile `/api`.
  - url: https://dev.profile.april.ukituki.tech/api
    description: |
      Прямой URL сервиса на dev-стенде (без BFF Hub), используется для backend smoke.
      Подставьте базовый URL за gateway. См. `docs/guides/FORK_AND_CUSTOMIZE.md`.
tags:
  - name: Admin
    description: |
      Операции merge дубликатов и очереди конфликтов authority. Требуют realm-роль (см. `KEYCLOAK_ADMIN_REALM_ROLE`).
paths:
  /v1/system/ping:
    get:
      summary: Публичная проверка API (без JWT)
      operationId: getSystemPing
      tags: [System]
      security: []
      responses:
        '200':
          description: Сервис отвечает
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    example: ok
  /v1/auth/whoami:
    get:
      summary: Идентичность и tenant из JWT (Keycloak)
      description: |
        `tenant_id` берётся только из согласованного claim access token (см. README / задачу 005), не из query/body.
      operationId: getAuthWhoAmI
      tags: [Auth]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Текущий субъект и tenant из токена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhoAmI'
        '401':
          description: Нет или невалидный Bearer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: В токене нет claim с tenant_id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/entity-types:
    get:
      summary: Список типов сущностей tenant
      operationId: listEntityTypes
      tags: [EntityTypes]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Каталог типов сущностей текущего tenant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityTypeListResponse'
        '401':
          description: Нет или невалидный Bearer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: В токене нет claim с tenant_id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Создать черновик типа сущности
      operationId: createEntityTypeDraft
      tags: [EntityTypes]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEntityTypeDraftRequest'
      responses:
        '201':
          description: Черновик типа создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityType'
        '400':
          description: Невалидный body или пустые поля namespace/code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Нет или невалидный Bearer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: В токене нет claim с tenant_id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/entity-types/{entityTypeID}/publish:
    post:
      summary: Опубликовать черновик типа сущности
      operationId: publishEntityTypeDraft
      tags: [EntityTypes]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: entityTypeID
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Тип успешно опубликован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityType'
        '404':
          description: Тип не найден в текущем tenant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Повторная публикация
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Черновик не проходит структурную валидацию/invariants
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Нет или невалидный Bearer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: В токене нет claim с tenant_id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/entities:
    post:
      summary: Создать профиль сущности (version=1)
      operationId: createEntityProfile
      tags: [Profiles]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEntityRequest'
      responses:
        '201':
          description: Профиль создан, первая версия сохранена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileSnapshot'
        '400':
          description: Невалидный payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Тип сущности не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Тип не опубликован, конфликт external mapping или все поля заблокированы authority
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Нет или невалидный Bearer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: В токене нет claim с tenant_id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/entities/{entityID}:
    get:
      summary: Получить текущую версию профиля
      description: |
        При активной серверной политике ABAC (`ABAC_SEGMENT_ACCESS_JSON`) тело `document` фильтруется
        по сегментам полей и realm-ролям из JWT (`realm_access.roles`); см. описание `ProfileSnapshot`.
      operationId: getEntityCurrentProfile
      tags: [Profiles]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EntityID'
      responses:
        '200':
          description: Текущая версия профиля
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileSnapshot'
        '404':
          description: Сущность не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Нет или невалидный Bearer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: В токене нет claim с tenant_id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      summary: Обновить профиль (append-only новая версия)
      operationId: updateEntityProfile
      tags: [Profiles]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EntityID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEntityRequest'
      responses:
        '200':
          description: Создана новая версия профиля
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileSnapshot'
        '400':
          description: Невалидный payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Сущность не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Конфликт external mapping или все предложенные поля отклонены authority (код `authority_all_blocked`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Нет или невалидный Bearer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: В токене нет claim с tenant_id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Удалить сущность и её версии
      operationId: deleteEntityProfile
      tags: [Profiles]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EntityID'
      responses:
        '204':
          description: Сущность удалена
        '404':
          description: Сущность не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Нет или невалидный Bearer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: В токене нет claim с tenant_id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/entities/{entityID}/versions/{version}:
    get:
      summary: Получить конкретную версию профиля
      description: |
        Как и `GET /v1/entities/{entityID}` — при ABAC выдача `document` может быть усечена по ролям.
      operationId: getEntityProfileByVersion
      tags: [Profiles]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EntityID'
        - in: path
          name: version
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: Конкретная версия профиля
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileSnapshot'
        '404':
          description: Версия или сущность не найдены
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Нет или невалидный Bearer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: В токене нет claim с tenant_id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/external-mappings/{sourceSystem}/{externalID}/entity:
    get:
      summary: Получить текущий профиль по внешнему ключу
      description: |
        Как и остальные GET профиля — при ABAC `document` фильтруется по realm-ролям JWT.
      operationId: getEntityCurrentByExternal
      tags: [Profiles]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: sourceSystem
          required: true
          schema:
            type: string
        - in: path
          name: externalID
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Текущий профиль для внешнего ключа
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileSnapshot'
        '404':
          description: Маппинг не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Нет или невалидный Bearer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: В токене нет claim с tenant_id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/admin/profile-conflicts:
    get:
      summary: Список открытых конфликтов authority (admin)
      description: |
        Требуется роль realm из `realm_access.roles` (имя задаётся `KEYCLOAK_ADMIN_REALM_ROLE`, по умолчанию ожидается `april-profile-admin`).
      operationId: listProfileFieldConflicts
      tags: [Admin]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Открытые конфликты
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileConflictListResponse'
        '401':
          description: Нет или невалидный Bearer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Нет tenant claim или недостаточно прав realm-роли
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/admin/profile-conflicts/{conflictID}/resolve:
    post:
      summary: Ручное разрешение конфликта authority
      description: |
        Записывает выбранное значение как новую версию профиля с источником `manual` в `_meta.authority`, закрывает конфликт, пишет аудит.
      operationId: resolveProfileFieldConflict
      tags: [Admin]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: conflictID
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveProfileConflictRequest'
      responses:
        '200':
          description: Новая версия профиля после разрешения
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileSnapshot'
        '400':
          description: Невалидный body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Нет или невалидный Bearer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Недостаточно прав
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Конфликт не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/admin/entities/merge:
    post:
      summary: Явный merge дубликатов профилей (source → target)
      description: |
        Объединяет профили в пределах tenant и одного `entity_type_id`, переносит external mappings, удаляет source, пишет аудит.
      operationId: mergeEntityProfiles
      tags: [Admin]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MergeEntityProfilesRequest'
      responses:
        '200':
          description: Результат merge (целевой профиль)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MergeEntityProfilesResponse'
        '400':
          description: Некорректная пара сущностей
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Нет или невалидный Bearer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Недостаточно прав
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Сущность не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Коллизия external mapping при merge
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /healthz:
    get:
      summary: Liveness
      operationId: getHealthz
      tags: [System]
      security: []
      responses:
        '200':
          description: Сервис жив
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
  /readyz:
    get:
      summary: Readiness
      description: |
        Endpoint отражает готовность внешних зависимостей:
        - PostgreSQL (`database`)
        - Redis (`redis`)
        При недоступности хотя бы одной обязательной зависимости возвращается `503`.
      operationId: getReadyz
      tags: [System]
      security: []
      responses:
        '200':
          description: Готов принимать трафик
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyzResponse'
        '503':
          description: Не готов (зависимости недоступны)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyzResponse'

components:
  parameters:
    EntityID:
      in: path
      name: entityID
      required: true
      schema:
        type: string
        format: uuid
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Access token Keycloak (проверка JWKS, iss, aud|azp).
        `tenant_id` извлекается только из trusted JWT claim, не из query/body/forwarded headers.
  schemas:
    WhoAmI:
      type: object
      required: [sub, tenant_id]
      properties:
        sub:
          type: string
          description: Subject из JWT (`sub`).
        tenant_id:
          type: string
          description: Идентификатор тенанта из доверенного claim (по умолчанию `tenant_id`).
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Стабильный код ошибки (машиночитаемый).
        message:
          type: string
          description: Описание для клиента и логов.
        request_id:
          description: Идентификатор запроса для корреляции в логах и трассировке.
          type: [string, 'null']
    ReadyzResponse:
      type: object
      required: [status, database, redis]
      properties:
        status:
          type: string
          enum: [ready, not_ready]
        database:
          type: string
          enum: [ok, unavailable]
        redis:
          type: string
          enum: [ok, unavailable, skipped]
    CreateEntityTypeDraftRequest:
      type: object
      required: [namespace, code, draft_schema]
      properties:
        namespace:
          type: string
          example: hr
        code:
          type: string
          example: employee
        draft_schema:
          type: object
          additionalProperties: true
          example:
            type: object
            properties:
              first_name:
                type: string
              last_name:
                type: string
            required: [first_name, last_name]
    EntityType:
      type: object
      required:
        - id
        - namespace
        - code
        - status
        - draft_schema
        - draft_schema_version
        - created_at
      properties:
        id:
          type: string
          format: uuid
        namespace:
          type: string
        code:
          type: string
        status:
          type: string
          enum: [draft, published]
        draft_schema:
          type: object
          additionalProperties: true
        draft_schema_version:
          type: integer
        published_schema:
          oneOf:
            - type: object
              additionalProperties: true
            - type: 'null'
        published_schema_version:
          oneOf:
            - type: integer
            - type: 'null'
        published_at:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
        created_at:
          type: string
          format: date-time
    EntityTypeListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/EntityType'
    ExternalRef:
      type: object
      required: [source_system, external_id]
      properties:
        source_system:
          type: string
          example: hris
        external_id:
          type: string
          example: EMP-100
    CreateEntityRequest:
      type: object
      required: [entity_type_id, document]
      properties:
        entity_type_id:
          type: string
          format: uuid
        document:
          type: object
          additionalProperties: true
        write_source:
          type: string
          description: Источник данных для начальной authority-метки полей (по умолчанию api).
        external_refs:
          type: array
          items:
            $ref: '#/components/schemas/ExternalRef'
    UpdateEntityRequest:
      type: object
      required: [document]
      properties:
        document:
          type: object
          additionalProperties: true
        write_source:
          type: string
          description: Логический источник входящего изменения для authority (по умолчанию api).
          example: hris
        external_refs:
          type: array
          items:
            $ref: '#/components/schemas/ExternalRef'
    ProfileSnapshot:
      type: object
      description: |
        Снимок профиля. Для **GET**-ответов при включённой политике ABAC на сервере поле `document`
        может не содержать часть namespace-объектов и корневых полей: видимость задаётся конфигурацией
        сопоставления сегментов полей realm-ролям Keycloak (переменная окружения `ABAC_SEGMENT_ACCESS_JSON`).
        Сегмент `default` — корневые скалярные поля документа; именованные вложенные объекты — сегменты
        с именем ключа верхнего уровня. В `_meta.authority` остаются только пути, относящиеся к разрешённым сегментам.
        **POST/PUT** возвращают полный документ без ABAC-фильтрации выдачи.
      required: [entity_id, entity_type_id, version, document, created_at, external_refs]
      properties:
        entity_id:
          type: string
          format: uuid
        entity_type_id:
          type: string
          format: uuid
        version:
          type: integer
          format: int64
        document:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
        external_refs:
          type: array
          items:
            $ref: '#/components/schemas/ExternalRef'
    ProfileConflictListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProfileFieldConflict'
    ProfileFieldConflict:
      type: object
      required:
        - id
        - entity_id
        - status
        - namespace
        - field_key
        - existing_source
        - incoming_source
        - reason
        - created_at
      properties:
        id:
          type: string
          format: uuid
        entity_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [open, resolved]
        namespace:
          type: string
        field_key:
          type: string
