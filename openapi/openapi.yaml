openapi: 3.1.0
info:
  title: April Profile API
  description: |
    REST API микросервиса April Profile (профиль пользователя).
    Спецификация ведётся в репозитории (`openapi/openapi.yaml`); скорректируйте `servers` под свой gateway.
  version: 0.1.0
  license:
    name: UNLICENSED
servers:
  - url: https://dev.profile.april.ukituki.tech/api
    description: |
      Подставьте базовый URL за gateway. См. `docs/guides/FORK_AND_CUSTOMIZE.md`.
paths:
  /v1/system/ping:
    get:
      summary: Публичная проверка API (без JWT)
      operationId: getSystemPing
      tags: [System]
      security: []
      responses:
        '200':
          description: Сервис отвечает
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    example: ok
  /v1/auth/whoami:
    get:
      summary: Идентичность и tenant из JWT (Keycloak)
      description: |
        `tenant_id` берётся только из согласованного claim access token (см. README / задачу 005), не из query/body.
      operationId: getAuthWhoAmI
      tags: [Auth]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Текущий субъект и tenant из токена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhoAmI'
        '401':
          description: Нет или невалидный Bearer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: В токене нет claim с tenant_id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/entity-types:
    get:
      summary: Список типов сущностей tenant
      operationId: listEntityTypes
      tags: [EntityTypes]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Каталог типов сущностей текущего tenant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityTypeListResponse'
        '401':
          description: Нет или невалидный Bearer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: В токене нет claim с tenant_id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Создать черновик типа сущности
      operationId: createEntityTypeDraft
      tags: [EntityTypes]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEntityTypeDraftRequest'
      responses:
        '201':
          description: Черновик типа создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityType'
        '400':
          description: Невалидный body или пустые поля namespace/code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Нет или невалидный Bearer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: В токене нет claim с tenant_id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/entity-types/{entityTypeID}/publish:
    post:
      summary: Опубликовать черновик типа сущности
      operationId: publishEntityTypeDraft
      tags: [EntityTypes]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: entityTypeID
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Тип успешно опубликован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityType'
        '404':
          description: Тип не найден в текущем tenant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Повторная публикация
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Черновик не проходит структурную валидацию/invariants
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Нет или невалидный Bearer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: В токене нет claim с tenant_id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /healthz:
    get:
      summary: Liveness
      operationId: getHealthz
      tags: [System]
      security: []
      responses:
        '200':
          description: Сервис жив
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
  /readyz:
    get:
      summary: Readiness
      description: |
        Endpoint отражает готовность внешних зависимостей:
        - PostgreSQL (`database`)
        - Redis (`redis`)
        При недоступности хотя бы одной обязательной зависимости возвращается `503`.
      operationId: getReadyz
      tags: [System]
      security: []
      responses:
        '200':
          description: Готов принимать трафик
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyzResponse'
        '503':
          description: Не готов (зависимости недоступны)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyzResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token Keycloak (проверка JWKS, iss, aud|azp).
  schemas:
    WhoAmI:
      type: object
      required: [sub, tenant_id]
      properties:
        sub:
          type: string
          description: Subject из JWT (`sub`).
        tenant_id:
          type: string
          description: Идентификатор тенанта из доверенного claim (по умолчанию `tenant_id`).
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Стабильный код ошибки (машиночитаемый).
        message:
          type: string
          description: Описание для клиента и логов.
        request_id:
          description: Идентификатор запроса для корреляции в логах и трассировке.
          type: [string, 'null']
    ReadyzResponse:
      type: object
      required: [status, database, redis]
      properties:
        status:
          type: string
          enum: [ready, not_ready]
        database:
          type: string
          enum: [ok, unavailable]
        redis:
          type: string
          enum: [ok, unavailable, skipped]
    CreateEntityTypeDraftRequest:
      type: object
      required: [namespace, code, draft_schema]
      properties:
        namespace:
          type: string
          example: hr
        code:
          type: string
          example: employee
        draft_schema:
          type: object
          additionalProperties: true
          example:
            type: object
            properties:
              first_name:
                type: string
              last_name:
                type: string
            required: [first_name, last_name]
    EntityType:
      type: object
      required:
        - id
        - namespace
        - code
        - status
        - draft_schema
        - draft_schema_version
        - created_at
      properties:
        id:
          type: string
          format: uuid
        namespace:
          type: string
        code:
          type: string
        status:
          type: string
          enum: [draft, published]
        draft_schema:
          type: object
          additionalProperties: true
        draft_schema_version:
          type: integer
        published_schema:
          oneOf:
            - type: object
              additionalProperties: true
            - type: 'null'
        published_schema_version:
          oneOf:
            - type: integer
            - type: 'null'
        published_at:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
        created_at:
          type: string
          format: date-time
    EntityTypeListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/EntityType'
