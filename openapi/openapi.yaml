openapi: 3.1.0
info:
  title: April Profile API
  description: |
    REST API микросервиса April Profile (профиль пользователя).
    Спецификация ведётся в репозитории (`openapi/openapi.yaml`); скорректируйте `servers` под свой gateway.
  version: 0.1.0
  license:
    name: UNLICENSED
servers:
  - url: https://dev.example.com/api
    description: |
      Подставьте базовый URL за gateway. См. `docs/guides/FORK_AND_CUSTOMIZE.md`.
paths:
  /v1/system/ping:
    get:
      summary: Публичная проверка API (без JWT)
      operationId: getSystemPing
      tags: [System]
      security: []
      responses:
        '200':
          description: Сервис отвечает
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    example: ok
  /v1/auth/whoami:
    get:
      summary: Идентичность и tenant из JWT (Keycloak)
      description: |
        `tenant_id` берётся только из согласованного claim access token (см. README / задачу 005), не из query/body.
      operationId: getAuthWhoAmI
      tags: [Auth]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Текущий субъект и tenant из токена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhoAmI'
        '401':
          description: Нет или невалидный Bearer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: В токене нет claim с tenant_id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /healthz:
    get:
      summary: Liveness
      operationId: getHealthz
      tags: [System]
      security: []
      responses:
        '200':
          description: Сервис жив
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
  /readyz:
    get:
      summary: Readiness
      description: |
        Endpoint отражает готовность внешних зависимостей:
        - PostgreSQL (`database`)
        - Redis (`redis`)
        При недоступности хотя бы одной обязательной зависимости возвращается `503`.
      operationId: getReadyz
      tags: [System]
      security: []
      responses:
        '200':
          description: Готов принимать трафик
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyzResponse'
        '503':
          description: Не готов (зависимости недоступны)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyzResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token Keycloak (проверка JWKS, iss, aud|azp).
  schemas:
    WhoAmI:
      type: object
      required: [sub, tenant_id]
      properties:
        sub:
          type: string
          description: Subject из JWT (`sub`).
        tenant_id:
          type: string
          description: Идентификатор тенанта из доверенного claim (по умолчанию `tenant_id`).
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Стабильный код ошибки (машиночитаемый).
        message:
          type: string
          description: Описание для клиента и логов.
        request_id:
          description: Идентификатор запроса для корреляции в логах и трассировке.
          type: [string, 'null']
    ReadyzResponse:
      type: object
      required: [status, database, redis]
      properties:
        status:
          type: string
          enum: [ready, not_ready]
        database:
          type: string
          enum: [ok, unavailable]
        redis:
          type: string
          enum: [ok, unavailable, skipped]
