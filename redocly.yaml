# Правила для `make openapi-lint`; при необходимости ужесточайте по мере зрелости API.
extends:
  - recommended

rules:
  operation-4xx-response: off
  info-license-url: off
  info-license-strict: off
  # Плейсхолдеры dev.example.com / localhost в шаблоне — до подстановки реального servers.url
  no-server-example.com: off
