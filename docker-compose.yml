# Базовый стек для dev/stage: backend + документация (статика + Structurizr Lite + Swagger UI) за Nginx.
# Теги образов задаются через .env / images.env (SHA) — см. docs/DEPLOYMENT_STRATEGY.md
# Локальная PostgreSQL 17: в `.env` задать COMPOSE_PROFILES=db или `docker compose --profile db up -d` (см. `.env.example`).

services:
  backend:
    image: "${BACKEND_IMAGE_REPO:-ghcr.io/ukituki-ps/april-profile-backend}:${IMAGE_TAG_BACKEND:-local}"
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      HTTP_LISTEN_ADDR: ":8080"
      DATABASE_URL: "${DATABASE_URL:-postgres://april:april@postgres:5432/april_profile?sslmode=disable}"
      REDIS_ADDR: "${REDIS_ADDR:-redis:6379}"
      REDIS_PASSWORD: "${REDIS_PASSWORD:-}"
      REDIS_DB: "${REDIS_DB:-0}"
      READINESS_TIMEOUT: "${READINESS_TIMEOUT:-3s}"
      READYZ_ALLOW_WITHOUT_REDIS: "${READYZ_ALLOW_WITHOUT_REDIS:-false}"
      KEYCLOAK_JWKS_URL: "${KEYCLOAK_JWKS_URL:-http://keycloak:8080/realms/april/protocol/openid-connect/certs}"
      KEYCLOAK_ISSUER: "${KEYCLOAK_ISSUER:-http://keycloak:8080/realms/april}"
      KEYCLOAK_AUDIENCE: "${KEYCLOAK_AUDIENCE:-april-profile-api}"
      KEYCLOAK_TENANT_CLAIM: "${KEYCLOAK_TENANT_CLAIM:-tenant_id}"
    ports:
      - "${BACKEND_HTTP_PORT:-18081}:8080"
    restart: unless-stopped

  # Фоновые задачи Asynq (ping + батч profile_outbox). Поднимается вместе с БД/Redis: `docker compose --profile db up -d`.
  worker:
    profiles: [db]
    image: "${BACKEND_IMAGE_REPO:-ghcr.io/ukituki-ps/april-profile-backend}:${IMAGE_TAG_BACKEND:-local}"
    build:
      context: .
      dockerfile: Dockerfile
    command: ["/usr/local/bin/april-worker"]
    environment:
      DATABASE_URL: "${DATABASE_URL:-postgres://april:april@postgres:5432/april_profile?sslmode=disable}"
      REDIS_ADDR: "${REDIS_ADDR:-redis:6379}"
      REDIS_PASSWORD: "${REDIS_PASSWORD:-}"
      REDIS_DB: "${REDIS_DB:-0}"
      ASYNQ_CONCURRENCY: "${ASYNQ_CONCURRENCY:-4}"
      OUTBOX_BATCH_SIZE: "${OUTBOX_BATCH_SIZE:-32}"
      ASYNQ_PING_INTERVAL: "${ASYNQ_PING_INTERVAL:-30s}"
      ASYNQ_OUTBOX_INTERVAL: "${ASYNQ_OUTBOX_INTERVAL:-15s}"
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  nginx-docs:
    image: nginx:1.27-alpine
    ports:
      - "${DOCS_HTTP_PORT:-8080}:80"
    volumes:
      - ./docs-site/build:/usr/share/nginx/html:ro
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./openapi:/usr/share/nginx/html/openapi:ro
    depends_on:
      - swagger-ui
    restart: unless-stopped

  swagger-ui:
    image: swaggerapi/swagger-ui:v5.17.14
    environment:
      BASE_URL: /swagger
      URL: /openapi/openapi.yaml
    volumes:
      - ./openapi:/usr/share/nginx/html/openapi:ro
    expose:
      - "8080"
    restart: unless-stopped

  structurizr-lite:
    image: structurizr/lite:2024.03.03
    ports:
      - "${STRUCTURIZR_HTTP_PORT:-8091}:8080"
    volumes:
      # Lite создаёт/обновляет workspace.json при работе — том не только для чтения
      - ./structurizr:/usr/local/structurizr
    restart: unless-stopped

  postgres:
    profiles: [db]
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-april}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-april}"
      POSTGRES_DB: "${POSTGRES_DB:-april_profile}"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    profiles: [db]
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    restart: unless-stopped

volumes:
  postgres_data:
