# Документация April: статика Docusaurus, OpenAPI (YAML), Swagger UI за префиксом /swagger/

server {
    listen 80;
    server_name _;

    # Собранный Docusaurus (docker compose монтирует docs-site/build → /usr/share/nginx/html)
    location / {
        root /usr/share/nginx/html;
        # Для запроса "/" не отдаём директорию (иначе 403), а явно фолбэчим в index.html.
        try_files $uri /index.html;
    }

    location /openapi/ {
        alias /usr/share/nginx/html/openapi/;
        default_type application/yaml;
        add_header Cache-Control "public, max-age=300";
    }

    location /swagger/ {
        proxy_pass http://swagger-ui:8080/swagger/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
